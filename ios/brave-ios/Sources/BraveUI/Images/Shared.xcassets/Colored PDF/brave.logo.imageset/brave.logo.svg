<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Scout's mark, the same one the home screen shows. It used to be the
       globe-and-tick while the app icon had already moved on, so onboarding
       introduced the browser with a mark the home screen no longer wore. -->
  <defs>
    <linearGradient id="app-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9F8BE6"/><stop offset="1" stop-color="#54408F"/>
    </linearGradient>
    <linearGradient id="app-core" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#6E58B8"/><stop offset="1" stop-color="#3C2D70"/>
    </linearGradient>
    <mask id="app-globe">
      <rect x="0" y="0" width="1024" height="1024" fill="#fff"/>
      <g fill="none" stroke="#000" stroke-width="44" stroke-linecap="round">
        <circle cx="512" cy="512" r="196"/>
        <line x1="316" y1="512" x2="708" y2="512"/>
        <path d="M512 316 C 434 382, 434 642, 512 708"/>
        <path d="M512 316 C 590 382, 590 642, 512 708"/>
      </g>
    </mask>
  </defs>
  <circle cx="512" cy="512" r="452" fill="url(#app-ring)"/>
  <circle cx="512" cy="512" r="368" fill="#FFF6E8"/>
  <circle cx="512" cy="512" r="330" fill="url(#app-core)" mask="url(#app-globe)"/>
</svg>
