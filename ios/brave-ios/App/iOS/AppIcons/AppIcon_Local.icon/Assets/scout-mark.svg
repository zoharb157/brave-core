<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Scout's mark for the home screen: a cream disc on Scout's violet, with
       the globe cut straight through it to the tile below.

       An iOS icon cannot be transparent — App Store Connect refuses an alpha
       channel, because the system needs an opaque square to apply its own
       mask to. The nearest thing to "no background" is therefore a tile in
       the brand colour with nothing lighter behind the mark, which is this.

       The disc is deliberately smaller than the tile. A larger one read as a
       cream icon with a violet rim rather than a violet icon. -->
  <defs>
    <mask id="scout-globe">
      <rect x="0" y="0" width="1024" height="1024" fill="#fff"/>
      <g fill="none" stroke="#000" stroke-width="44" stroke-linecap="round">
        <circle cx="512" cy="512" r="190"/>
        <line x1="322" y1="512" x2="702" y2="512"/>
        <path d="M512 322 C 436 386, 436 638, 512 702"/>
        <path d="M512 322 C 588 386, 588 638, 512 702"/>
      </g>
    </mask>
  </defs>
  <circle cx="512" cy="512" r="352" fill="#FFF6E8" mask="url(#scout-globe)"/>
</svg>
