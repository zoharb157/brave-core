<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Scout's mark: a round browser mark — an outer ring, a light separating
       ring, and a strong centre disc with the globe cut out of it.

       The structure a browser icon has worn since Chrome, in Scout's own
       colours and with Scout's own centre. Not the tri-colour wheel: that
       segmented ring with a contrasting centre is Google's, and an icon that
       reads as a copy of it fails App Review's copycat rule whatever the
       palette.

       The centre is deliberately large against a thin ring. An earlier draft
       split the diameter evenly and the concentric bands closed up at 29pt in
       a Spotlight result, which is where an icon has to work hardest. -->
  <defs>
    <linearGradient id="scout-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9F8BE6"/><stop offset="1" stop-color="#54408F"/>
    </linearGradient>
    <linearGradient id="scout-core" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#6E58B8"/><stop offset="1" stop-color="#3C2D70"/>
    </linearGradient>
    <mask id="scout-globe">
      <rect x="0" y="0" width="1024" height="1024" fill="#fff"/>
      <g fill="none" stroke="#000" stroke-width="44" stroke-linecap="round">
        <circle cx="512" cy="512" r="196"/>
        <line x1="316" y1="512" x2="708" y2="512"/>
        <path d="M512 316 C 434 382, 434 642, 512 708"/>
        <path d="M512 316 C 590 382, 590 642, 512 708"/>
      </g>
    </mask>
  </defs>
  <circle cx="512" cy="512" r="452" fill="url(#scout-ring)"/>
  <circle cx="512" cy="512" r="368" fill="#FFF6E8"/>
  <circle cx="512" cy="512" r="330" fill="url(#scout-core)" mask="url(#scout-globe)"/>
</svg>
